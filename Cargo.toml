[workspace]
members = [
    "crates/chainmark-types",
    "crates/chainmark-detectors",
    "crates/chainmark-vault",
    "crates/chainmark-buffer",
    "crates/chainmark-evidence",
    "crates/chainmark-proxy",
]
resolver = "2"

[workspace.package]
version = "0.2.0"
edition = "2021"
authors = ["Chainmark AI Team"]
license = "Apache-2.0"

[workspace.dependencies]
chainmark-types = { path = "crates/chainmark-types" }
chainmark-detectors = { path = "crates/chainmark-detectors" }
chainmark-vault = { path = "crates/chainmark-vault" }
chainmark-buffer = { path = "crates/chainmark-buffer" }
chainmark-evidence = { path = "crates/chainmark-evidence" }

tokio = { version = "1.40", features = ["full"] }
axum = { version = "0.7", features = ["macros"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.5", features = ["cors", "trace"] }
http-body-util = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "default-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
aes-gcm = "0.10"
p256 = { version = "0.13", features = ["ecdsa", "pem"] }
sha2 = "0.10"
hmac = "0.12"
rand = "0.8"
regex = "1.10"
bytes = "1.7"
tokio-stream = { version = "0.1", features = ["sync"] }
futures = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
zip = { version = "2.2", default-features = false, features = ["deflate"] }
base64 = "0.22"
thiserror = "1.0"
uuid = { version = "1.10", features = ["v4"] }
hex = "0.4"
