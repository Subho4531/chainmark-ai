<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200" role="img" aria-labelledby="wireframeTitle wireframeDesc">
  <title id="wireframeTitle">Chainmark AI hero wireframe — The Receipt</title>
  <desc id="wireframeDesc">Low-fidelity desktop wireframe of a proof-first hero: static headline, two calls to action, a setup command, an evidence receipt showing raw values becoming tokens, a verification result, a five-stage rail, and six annotations.</desc>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=DotGothic16&amp;family=Inter:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap');
    text { font-family: 'Inter', 'Segoe UI', sans-serif; }
    .mono { font-family: 'JetBrains Mono', Consolas, monospace; }
    .pixel { font-family: 'DotGothic16', 'JetBrains Mono', monospace; }
    .eyebrow { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 9px; letter-spacing: 1.5px; }
    .label { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 9px; letter-spacing: .4px; }
    .tiny { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 7.5px; letter-spacing: .6px; }
    .pin { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 8px; font-weight: 500; }
  </style>

  <!-- Sheet -->
  <rect width="1600" height="1200" fill="#0a0a0a"/>

  <!-- Sheet header -->
  <text x="80" y="40" class="mono" fill="#ff571a" font-size="10" letter-spacing="2">CHAINMARK AI</text>
  <text x="80" y="64" fill="#f2efe9" font-size="19" font-weight="500">Hero wireframe — “The Receipt”</text>
  <text x="1520" y="42" class="mono" fill="#6c675f" font-size="9" text-anchor="end" letter-spacing="1">V1 · LOW-FI · PROOF FIRST</text>
  <text x="1520" y="60" class="mono" fill="#6c675f" font-size="9" text-anchor="end" letter-spacing=".6">desktop 1440 · above the fold</text>
  <line x1="80" y1="80" x2="1520" y2="80" stroke="#242424"/>

  <!-- Device frame -->
  <rect x="80" y="96" width="1440" height="824" fill="#050505" stroke="#2a2a2a"/>

  <!-- Browser chrome -->
  <rect x="80" y="96" width="1440" height="28" fill="#0b0b0b" stroke="#2a2a2a"/>
  <circle cx="96" cy="110" r="3" fill="#333333"/>
  <circle cx="110" cy="110" r="3" fill="#333333"/>
  <circle cx="124" cy="110" r="3" fill="#333333"/>
  <rect x="150" y="101" width="220" height="18" rx="2" fill="#111111" stroke="#242424"/>
  <text x="160" y="114" class="mono" fill="#6c675f" font-size="8">chainmark.ai</text>

  <!-- Site header -->
  <rect x="80" y="124" width="1440" height="72" fill="#050505"/>
  <line x1="80" y1="196" x2="1520" y2="196" stroke="#1b1b1b"/>

  <!-- Mark: two interlocking links -->
  <rect x="112" y="150" width="14" height="14" rx="3" fill="none" stroke="#ff571a" stroke-width="1.5"/>
  <rect x="120" y="158" width="14" height="14" rx="3" fill="none" stroke="#ff571a" stroke-width="1.5"/>
  <text x="146" y="167" class="pixel" fill="#f2efe9" font-size="13" letter-spacing="1.2">CHAINMARK</text>
  <rect x="240" y="154" width="21" height="13" rx="1" fill="none" stroke="#ff571a" stroke-opacity=".42"/>
  <text x="250.5" y="163.5" class="mono" fill="#ff571a" font-size="6.5" text-anchor="middle" letter-spacing="1">AI</text>

  <!-- Nav -->
  <text x="650" y="165" class="label" fill="#dedad3">ARCHITECTURE</text>
  <text x="740" y="165" class="label" fill="#dedad3">EVALS</text>
  <text x="800" y="165" class="label" fill="#dedad3">PRICING</text>
  <text x="864" y="165" class="label" fill="#dedad3">RESOURCES</text>

  <!-- Header actions -->
  <rect x="1248" y="141" width="38" height="38" fill="none" stroke="#242424"/>
  <text x="1267" y="164" class="mono" fill="#9a958c" font-size="8" text-anchor="middle">GH</text>
  <text x="1310" y="165" class="label" fill="#dedad3">Log in</text>
  <rect x="1350" y="141" width="104" height="38" rx="2" fill="#ff571a"/>
  <text x="1402" y="164.5" class="mono" fill="#ffffff" font-size="9" text-anchor="middle">Sign up</text>

  <!-- Hero copy -->
  <line x1="120" y1="236" x2="144" y2="236" stroke="#ff571a" stroke-opacity=".6"/>
  <text x="154" y="240" class="eyebrow" fill="#ff571a">SECURITY INFRASTRUCTURE · AGENT EGRESS</text>

  <text x="120" y="312" class="pixel" fill="#f2efe9" font-size="40" letter-spacing=".3">Your agents leave tokens<tspan fill="#ff571a">.</tspan></text>
  <text x="120" y="362" class="pixel" fill="#f2efe9" font-size="40" letter-spacing=".3">You keep the proof<tspan fill="#ff571a">.</tspan></text>

  <text x="120" y="408" fill="#9a958c" font-size="14.5">Deterministic detection, reversible tokenization, and a signed</text>
  <text x="120" y="432" fill="#9a958c" font-size="14.5">evidence chain you can verify offline.</text>

  <!-- Actions -->
  <rect x="120" y="472" width="176" height="50" rx="2" fill="#ff571a"/>
  <text x="208" y="502" fill="#ffffff" font-size="13" font-weight="500" text-anchor="middle">Start building</text>
  <rect x="308" y="472" width="192" height="50" rx="2" fill="none" stroke="#333333"/>
  <text x="404" y="502" fill="#e9e5dd" font-size="13" font-weight="500" text-anchor="middle">See a verified run</text>

  <!-- Command bar -->
  <rect x="120" y="546" width="620" height="42" rx="2" fill="#070707" stroke="#242424"/>
  <text x="136" y="572" class="mono" fill="#b6b1a8" font-size="10.5">$ uv run python scripts/run_local.py</text>
  <rect x="700" y="558" width="10" height="10" rx="1" fill="none" stroke="#88837a" stroke-width="1.2"/>
  <path d="M704 555h10v10" fill="none" stroke="#88837a" stroke-width="1.2"/>

  <!-- Proof chips -->
  <text x="120" y="616" class="tiny" fill="#6c675f" letter-spacing="1.5">PROOF</text>
  <rect x="120" y="628" width="138" height="26" rx="2" fill="#070707" stroke="#242424"/>
  <text x="189" y="645" class="tiny" fill="#b1aca3" text-anchor="middle">VERHOEFF + LUHN</text>
  <rect x="268" y="628" width="116" height="26" rx="2" fill="#070707" stroke="#242424"/>
  <text x="326" y="645" class="tiny" fill="#b1aca3" text-anchor="middle">AES-256-GCM</text>
  <rect x="394" y="628" width="136" height="26" rx="2" fill="#070707" stroke="#242424"/>
  <text x="462" y="645" class="tiny" fill="#b1aca3" text-anchor="middle">OFFLINE VERIFIER</text>

  <!-- Stage rail -->
  <line x1="120" y1="700" x2="1480" y2="700" stroke="#242424"/>
  <g>
    <text x="120" y="724" class="tiny" fill="#ff571a" letter-spacing="1">01</text>
    <text x="120" y="742" fill="#dedad3" font-size="12">INTERCEPT</text>
    <text x="120" y="758" class="tiny" fill="#6c675f">agent egress</text>
  </g>
  <g>
    <text x="392" y="724" class="tiny" fill="#ff571a" letter-spacing="1">02</text>
    <text x="392" y="742" fill="#dedad3" font-size="12">DETECT</text>
    <text x="392" y="758" class="tiny" fill="#6c675f">checksum + taint</text>
  </g>
  <g>
    <text x="664" y="724" class="tiny" fill="#ff571a" letter-spacing="1">03</text>
    <text x="664" y="742" fill="#dedad3" font-size="12">TOKENIZE</text>
    <text x="664" y="758" class="tiny" fill="#6c675f">hmac vault</text>
  </g>
  <g>
    <text x="936" y="724" class="tiny" fill="#ff571a" letter-spacing="1">04</text>
    <text x="936" y="742" fill="#dedad3" font-size="12">SEAL</text>
    <text x="936" y="758" class="tiny" fill="#6c675f">hash chain</text>
  </g>
  <g>
    <text x="1208" y="724" class="tiny" fill="#ff571a" letter-spacing="1">05</text>
    <text x="1208" y="742" fill="#dedad3" font-size="12">RESTORE</text>
    <text x="1208" y="758" class="tiny" fill="#6c675f">streaming</text>
  </g>

  <!-- Terminal strip -->
  <rect x="120" y="782" width="1360" height="32" rx="2" fill="#070707" stroke="#242424"/>
  <text x="134" y="802" class="mono" fill="#6c675f" font-size="9">$ chainmark-verify --session agent-7f2c</text>
  <text x="1466" y="802" class="mono" fill="#ff7a45" font-size="9" text-anchor="end">VERIFIED · exit 0</text>

  <!-- Fold line -->
  <line x1="80" y1="860" x2="1520" y2="860" stroke="#333333" stroke-dasharray="4 6"/>
  <text x="1466" y="852" class="tiny" fill="#6c675f" text-anchor="end">first viewport ≈ 860px</text>

  <!-- Receipt panel -->
  <rect x="920" y="220" width="560" height="480" fill="#070707" stroke="#242424"/>
  <text x="938" y="246" class="tiny" fill="#9a958c" letter-spacing="1">REQUEST 0042 · BILLING AGENT</text>
  <text x="1462" y="246" class="tiny" fill="#ff571a" text-anchor="end" letter-spacing="1">RAW → SEALED</text>
  <line x1="920" y1="262" x2="1480" y2="262" stroke="#1b1b1b"/>

  <!-- Raw half -->
  <text x="938" y="288" class="tiny" fill="#ff571a" letter-spacing="1">AGENT OUTBOUND / RAW</text>

  <text x="938" y="324" class="tiny" fill="#5c5851">to</text>
  <rect x="986" y="308" width="180" height="18" fill="#ff571a" fill-opacity=".1"/>
  <line x1="986" y1="326" x2="1166" y2="326" stroke="#ff571a" stroke-opacity=".45"/>
  <text x="990" y="322" class="mono" fill="#b6b1a8" font-size="10.5">billing@acme-corp.com</text>

  <text x="938" y="356" class="tiny" fill="#5c5851">card</text>
  <rect x="986" y="340" width="166" height="18" fill="#ff571a" fill-opacity=".1"/>
  <line x1="986" y1="358" x2="1152" y2="358" stroke="#ff571a" stroke-opacity=".45"/>
  <text x="990" y="354" class="mono" fill="#b6b1a8" font-size="10.5">4242 4242 4242 4242</text>

  <text x="938" y="388" class="tiny" fill="#5c5851">iban</text>
  <rect x="986" y="372" width="236" height="18" fill="#ff571a" fill-opacity=".1"/>
  <line x1="986" y1="390" x2="1222" y2="390" stroke="#ff571a" stroke-opacity=".45"/>
  <text x="990" y="386" class="mono" fill="#b6b1a8" font-size="9.5">DE89 3704 0044 0532 0130 00</text>

  <text x="938" y="420" class="tiny" fill="#5c5851">task</text>
  <text x="990" y="418" class="mono" fill="#8b867e" font-size="9.5">summarise the invoice and reply</text>

  <!-- Seam -->
  <rect x="920" y="438" width="560" height="54" fill="#ff571a" fill-opacity=".05"/>
  <line x1="920" y1="438" x2="1480" y2="438" stroke="#ff571a" stroke-opacity=".35"/>
  <line x1="920" y1="492" x2="1480" y2="492" stroke="#ff571a" stroke-opacity=".35"/>
  <text x="938" y="470" class="tiny" fill="#6c675f" letter-spacing="1">SEAM</text>
  <text x="1200" y="466" class="mono" fill="#ff571a" font-size="9.5" text-anchor="middle" letter-spacing="2">DETECT → TOKENIZE → SEAL</text>
  <text x="1462" y="470" class="tiny" fill="#6c675f" text-anchor="end" letter-spacing="1">CHAINMARK</text>

  <!-- Sealed half -->
  <text x="938" y="520" class="tiny" fill="#ff571a" letter-spacing="1">MODEL INBOUND / SEALED</text>

  <text x="938" y="556" class="tiny" fill="#5c5851">to</text>
  <rect x="986" y="540" width="112" height="18" fill="#ff571a" fill-opacity=".07" stroke="#ff571a" stroke-opacity=".3"/>
  <text x="996" y="553" class="mono" fill="#ff7a45" font-size="9">cm_mail_7f2a</text>

  <text x="938" y="588" class="tiny" fill="#5c5851">card</text>
  <rect x="986" y="572" width="104" height="18" fill="#ff571a" fill-opacity=".07" stroke="#ff571a" stroke-opacity=".3"/>
  <text x="996" y="585" class="mono" fill="#ff7a45" font-size="9">cm_pan_91c4</text>

  <text x="938" y="620" class="tiny" fill="#5c5851">iban</text>
  <rect x="986" y="604" width="112" height="18" fill="#ff571a" fill-opacity=".07" stroke="#ff571a" stroke-opacity=".3"/>
  <text x="996" y="617" class="mono" fill="#ff7a45" font-size="9">cm_iban_3d88</text>

  <text x="938" y="652" class="tiny" fill="#5c5851">task</text>
  <text x="990" y="650" class="mono" fill="#8b867e" font-size="9.5">summarise the invoice and reply</text>

  <!-- Receipt footer -->
  <line x1="920" y1="664" x2="1480" y2="664" stroke="#1b1b1b"/>
  <text x="938" y="687" class="tiny" fill="#ff7a45" letter-spacing=".6">● CHAIN VERIFIED · SEQ 0–41 · ECDSA P-256 · 0 PLAINTEXT</text>

  <!-- Annotation pins -->
  <g>
    <circle cx="880" cy="236" r="9" fill="#0a0a0a" stroke="#ff571a"/>
    <text x="880" y="239" class="pin" fill="#ff571a" text-anchor="middle">01</text>
    <circle cx="1488" cy="210" r="9" fill="#0a0a0a" stroke="#ff571a"/>
    <text x="1488" y="213" class="pin" fill="#ff571a" text-anchor="middle">02</text>
    <circle cx="1488" cy="320" r="9" fill="#0a0a0a" stroke="#ff571a"/>
    <text x="1488" y="323" class="pin" fill="#ff571a" text-anchor="middle">03</text>
    <circle cx="1488" cy="680" r="9" fill="#0a0a0a" stroke="#ff571a"/>
    <text x="1488" y="683" class="pin" fill="#ff571a" text-anchor="middle">04</text>
    <circle cx="580" cy="614" r="9" fill="#0a0a0a" stroke="#ff571a"/>
    <text x="580" y="617" class="pin" fill="#ff571a" text-anchor="middle">05</text>
    <circle cx="1488" cy="465" r="9" fill="#0a0a0a" stroke="#ff571a"/>
    <text x="1488" y="468" class="pin" fill="#ff571a" text-anchor="middle">06</text>
  </g>

  <!-- Annotation key -->
  <text x="80" y="968" class="mono" fill="#ff571a" font-size="9" letter-spacing="1.5">ANNOTATION KEY</text>
  <line x1="80" y1="980" x2="1520" y2="980" stroke="#242424"/>

  <g>
    <circle cx="90" cy="1006" r="10" fill="none" stroke="#ff571a"/>
    <text x="90" y="1009" class="pin" fill="#ff571a" text-anchor="middle">01</text>
    <text x="110" y="1009" class="mono" fill="#f2efe9" font-size="9" letter-spacing=".6">STATIC CLAIM</text>
    <text x="110" y="1024" class="mono" fill="#9a958c" font-size="8.5">One specific headline; no word carousel.</text>
  </g>
  <g>
    <circle cx="570" cy="1006" r="10" fill="none" stroke="#ff571a"/>
    <text x="570" y="1009" class="pin" fill="#ff571a" text-anchor="middle">02</text>
    <text x="590" y="1009" class="mono" fill="#f2efe9" font-size="9" letter-spacing=".6">PROOF IN VIEW</text>
    <text x="590" y="1024" class="mono" fill="#9a958c" font-size="8.5">Evidence receipt visible above the fold.</text>
  </g>
  <g>
    <circle cx="1050" cy="1006" r="10" fill="none" stroke="#ff571a"/>
    <text x="1050" y="1009" class="pin" fill="#ff571a" text-anchor="middle">03</text>
    <text x="1070" y="1009" class="mono" fill="#f2efe9" font-size="9" letter-spacing=".6">RAW → TOKEN</text>
    <text x="1070" y="1024" class="mono" fill="#9a958c" font-size="8.5">Real values and tokens, not abstract packets.</text>
  </g>

  <g>
    <circle cx="90" cy="1086" r="10" fill="none" stroke="#ff571a"/>
    <text x="90" y="1089" class="pin" fill="#ff571a" text-anchor="middle">04</text>
    <text x="110" y="1089" class="mono" fill="#f2efe9" font-size="9" letter-spacing=".6">VERIFY RESULT</text>
    <text x="110" y="1104" class="mono" fill="#9a958c" font-size="8.5">“VERIFIED · exit 0” lives inside the hero.</text>
  </g>
  <g>
    <circle cx="570" cy="1086" r="10" fill="none" stroke="#ff571a"/>
    <text x="570" y="1089" class="pin" fill="#ff571a" text-anchor="middle">05</text>
    <text x="590" y="1089" class="mono" fill="#f2efe9" font-size="9" letter-spacing=".6">CRYPTO SPECIFICS</text>
    <text x="590" y="1104" class="mono" fill="#9a958c" font-size="8.5">Checksum, cipher and verifier are named.</text>
  </g>
  <g>
    <circle cx="1050" cy="1086" r="10" fill="none" stroke="#ff571a"/>
    <text x="1050" y="1089" class="pin" fill="#ff571a" text-anchor="middle">06</text>
    <text x="1070" y="1089" class="mono" fill="#f2efe9" font-size="9" letter-spacing=".6">ONE SEAM</text>
    <text x="1070" y="1104" class="mono" fill="#9a958c" font-size="8.5">A single band organizes hero and page story.</text>
  </g>

  <line x1="80" y1="1140" x2="1520" y2="1140" stroke="#1b1b1b"/>
  <text x="80" y="1162" class="mono" fill="#6c675f" font-size="8" letter-spacing=".4">WIREFRAME · NOT FINAL UI · exact copy and rationale: design/hero-wireframe-brief.md</text>
  <rect x="1490" y="1152" width="30" height="10" fill="#ff571a" fill-opacity=".12" stroke="#ff571a" stroke-opacity=".3"/>
</svg>
